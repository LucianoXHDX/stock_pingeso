name: stock-grupo-8

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Completar POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completar POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-stock}
      TZ: ${TZ:-America/Santiago}
    volumes:
      - stock-datos:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  migrate:
    image: stock-migrate:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrate
    command:
      - -dir
      - /app/db/migrations
      - postgres
      - ${DATABASE_URL:?Completar DATABASE_URL en .env}
      - up
    environment:
      TZ: ${TZ:-America/Santiago}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'

  backend:
    image: stock-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-8080}
      API_ENV: ${API_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:?Completar DATABASE_URL en .env}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?Completar AUTH_JWKS_URL en .env}
      AUTH_ISSUER: ${AUTH_ISSUER:?Completar AUTH_ISSUER en .env}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?Completar AUTH_AUDIENCE en .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sesion}
      PRODUCTOS_URL: ${PRODUCTOS_URL:?Completar PRODUCTOS_URL en .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5120}
      TZ: ${TZ:-America/Santiago}
    ports:
      - 127.0.0.1:5121:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  frontend:
    image: stock-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      SPA_DIRECTORY: ${SPA_DIRECTORY:-/srv}
      TZ: ${TZ:-America/Santiago}
    ports:
      - 127.0.0.1:5120:8080
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  seed:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    profiles: [dev]
    user: postgres
    entrypoint: [psql]
    command:
      - ${DATABASE_URL:?Completar DATABASE_URL en .env}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /seed/seed.sql
    volumes:
      - ./apps/api/db/seed.sql:/seed/seed.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    profiles: [dev]
    user: '65532:65532'
    environment:
      MP_DATABASE: /tmp/mailpit.db
      TZ: ${TZ:-America/Santiago}
    ports:
      - 127.0.0.1:8025:8025
      - 127.0.0.1:1025:1025
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

volumes:
  stock-datos:
