components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Existencia:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Existencia.json
          format: uri
          readOnly: true
          type: string
        actualizado_en:
          description: Instante UTC del último movimiento. Valor cero si aún no hay movimientos.
          format: date-time
          type: string
        cantidad:
          examples:
            - 20
          format: int64
          maximum: 1000000000
          minimum: 0
          type: integer
        producto_id:
          examples:
            - 11111111-1111-4111-8111-111111111111
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        version:
          examples:
            - 1
          format: int64
          minimum: 0
          type: integer
      required:
        - producto_id
        - cantidad
        - version
        - actualizado_en
      type: object
    Movimiento:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Movimiento.json
          format: uri
          readOnly: true
          type: string
        actor_id:
          format: uuid
          type: string
        cantidad:
          description: Magnitud absoluta de la variación de stock; en ajustes el saldo objetivo está en saldo_posterior.
          format: int64
          maximum: 1000000000
          minimum: 1
          type: integer
        creado_en:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        motivo:
          examples:
            - Reposición de mercadería
          maxLength: 500
          minLength: 3
          type: string
        producto_id:
          format: uuid
          type: string
        referencia:
          examples:
            - OC-2026-001
          maxLength: 200
          type: string
        saldo_anterior:
          format: int64
          minimum: 0
          type: integer
        saldo_posterior:
          format: int64
          minimum: 0
          type: integer
        tipo:
          enum:
            - entrada
            - salida
            - ajuste
          examples:
            - entrada
          type: string
      required:
        - id
        - producto_id
        - tipo
        - cantidad
        - saldo_anterior
        - saldo_posterior
        - motivo
        - referencia
        - actor_id
        - creado_en
      type: object
    PaginaExistencias:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PaginaExistencias.json
          format: uri
          readOnly: true
          type: string
        datos:
          items:
            $ref: "#/components/schemas/Existencia"
          type:
            - array
            - "null"
        total:
          format: int64
          minimum: 0
          type: integer
      required:
        - datos
        - total
      type: object
    PaginaMovimientos:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/PaginaMovimientos.json
          format: uri
          readOnly: true
          type: string
        datos:
          items:
            $ref: "#/components/schemas/Movimiento"
          type:
            - array
            - "null"
        total:
          format: int64
          minimum: 0
          type: integer
      required:
        - datos
        - total
      type: object
    SalidaSaludBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SalidaSaludBody.json
          format: uri
          readOnly: true
          type: string
        estado:
          examples:
            - ok
          type: string
        version:
          examples:
            - a1b2c3d
          type: string
      required:
        - estado
        - version
      type: object
    SolicitudMovimiento:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SolicitudMovimiento.json
          format: uri
          readOnly: true
          type: string
        cantidad:
          description: Para entradas/salidas, mayor que cero. Para ajustes, nuevo saldo absoluto.
          examples:
            - 5
          format: int64
          maximum: 1000000000
          minimum: 0
          type: integer
        motivo:
          examples:
            - Reposición de mercadería
          maxLength: 500
          minLength: 3
          type: string
        producto_id:
          examples:
            - 11111111-1111-4111-8111-111111111111
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
        referencia:
          examples:
            - OC-2026-001
          maxLength: 200
          type: string
        tipo:
          enum:
            - entrada
            - salida
            - ajuste
          examples:
            - entrada
          type: string
        version_esperada:
          description: "Obligatoria para ajustes: versión de la existencia consultada."
          format: int64
          minimum: 0
          type: integer
      required:
        - producto_id
        - tipo
        - cantidad
        - motivo
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: "Para llamadas entre servicios: reenviar JWT del usuario."
      scheme: bearer
      type: http
    sesion:
      description: JWT emitido por Identidad en cookie HttpOnly, Secure, SameSite=Lax.
      in: cookie
      name: sesion
      type: apiKey
info:
  description: Entradas, salidas, ajustes con control de versión e historial de inventario. Productos es el dueño del catálogo.
  title: STOCK · Grupo 8
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/existencias:
    get:
      operationId: listar-existencias
      parameters:
        - explode: false
          in: query
          name: limite
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: desplazamiento
          schema:
            default: 0
            format: int64
            maximum: 1000000
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaExistencias"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - sesion: []
        - bearer: []
      summary: Listar existencias registradas
      tags:
        - Stock
      x-permiso: stock:consultar
  /api/v1/existencias/{producto_id}:
    get:
      operationId: consultar-existencia
      parameters:
        - example: 11111111-1111-4111-8111-111111111111
          in: path
          name: producto_id
          required: true
          schema:
            examples:
              - 11111111-1111-4111-8111-111111111111
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Existencia"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - sesion: []
        - bearer: []
      summary: Consultar stock de un producto
      tags:
        - Stock
      x-permiso: stock:consultar
  /api/v1/movimientos:
    get:
      operationId: listar-movimientos
      parameters:
        - explode: false
          in: query
          name: limite
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: desplazamiento
          schema:
            default: 0
            format: int64
            maximum: 1000000
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: producto_id
          schema:
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            type: string
        - explode: false
          in: query
          name: tipo
          schema:
            enum:
              - entrada
              - salida
              - ajuste
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaMovimientos"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - sesion: []
        - bearer: []
      summary: Consultar historial de movimientos
      tags:
        - Stock
      x-permiso: stock:consultar
    post:
      description: Entrada/salida requieren stock:operar; ajuste requiere stock:administrar y version_esperada. Repetir la misma clave, usuario y contenido devuelve el mismo movimiento (201); otra solicitud con esa clave devuelve 409. La reversa se registra como una operación inversa con una clave nueva y la referencia al movimiento original.
      operationId: crear-movimiento
      parameters:
        - example: ingreso-oc-2026-001
          in: header
          name: Idempotency-Key
          required: true
          schema:
            examples:
              - ingreso-oc-2026-001
            maxLength: 128
            minLength: 8
            pattern: ^[A-Za-z0-9._:-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudMovimiento"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movimiento"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - sesion: []
        - bearer: []
      summary: Registrar entrada, salida o ajuste
      tags:
        - Stock
      x-permisos:
        ajuste: stock:administrar
        entrada: stock:operar
        salida: stock:operar
  /healthz:
    get:
      operationId: salud
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalidaSaludBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Comprobar proceso
      tags:
        - Salud
  /readyz:
    get:
      operationId: disponibilidad
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalidaSaludBody"
          description: OK
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Comprobar PostgreSQL
      tags:
        - Salud
