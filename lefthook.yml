pre-commit:
  commands:
    format:
      glob: "*.{json,md,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    go-fmt:
      glob: "*.go"
      run: cd apps/api && test -z "$(gofmt -l .)" && go vet ./...
    secretos:
      run: gitleaks git --staged --redact --no-banner
