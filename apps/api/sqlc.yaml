version: '2'
sql:
  - engine: postgresql
    queries: db/queries
    schema: db/migrations
    gen:
      go:
        package: repository
        out: internal/repository
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_json_tags: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
